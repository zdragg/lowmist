[workspace]
resolver = "3"
members = ["lowmist", "lowmist-respack", "lowmist-schem"]
default-members = ["lowmist"]

[workspace.dependencies]
glam = "^0.33.2"  # Follow bevy glam version
itertools = "0.15.0"
lowmist-respack = { path = "lowmist-respack" }
lowmist-schem = { path = "lowmist-schem" }
serde = "1.0.229"
serde_json = "1.0.154"
snafu = "0.9.2"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
