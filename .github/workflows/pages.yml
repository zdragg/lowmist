name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BEVY_CLI_REV: df79097
  BINARYEN_VERSION: version_133

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo install --git https://github.com/TheBevyFlock/bevy_cli --rev $BEVY_CLI_REV --locked bevy_cli

      - run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> $GITHUB_PATH

      - run: bevy build --yes --release web --bundle --bundle-dir dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
