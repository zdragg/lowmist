[package]
name = "lowmist"
version = "0.1.0"
edition = "2024"

[package.metadata.bevy_cli.unstable]
web-multi-threading = true

[dependencies]
bevy = { version = "0.20.0", features = ["debug", "https", "render_dev_tools", "web_asset_cache", "webgpu"] }
bevy_web_file_drop = "0.5.0"
flume = "0.12.0"
glam.workspace = true
itertools.workspace = true
log = "0.4.34"
lowmist-respack.workspace = true
lowmist-schem.workspace = true
nunny.workspace = true
rayon = "1.12.0"
voxel-traversal = "0.4.0"

[target.'cfg(target_family = "wasm")'.dependencies]
flume = { version = "0.12.0", features = ["spin"] }  # Atomic waiting not supported, use spinlock
wasm-bindgen = "0.2.129"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
